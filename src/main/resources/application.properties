spring.application.name=flightFinder

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flightfinder}
spring.datasource.username=admin
#spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=admin
#spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Encryption (32-byte base64 encoded key for AES-256)
app.encryption.key=${ENCRYPTION_KEY:}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=2592000000

# Admin credentials for scheduled PDF download
app.admin.user=${ADMIN_USER:}
app.admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} \u001B[32m%-5level \u001B[0m - %msg \u001B[36m[%class.%method:%line]\u001B[0m%n
logging.file.name=messages.log
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss} %-5level - %msg [%class.%method:%line]%n

# Prometheus/Actuator
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.graphite.metrics.export.enabled=true

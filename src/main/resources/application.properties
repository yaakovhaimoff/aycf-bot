spring.application.name=flightFinder

# Bind to localhost only — OpenClaw connects via http://localhost:8080/sse
server.address=127.0.0.1

# Wizz Air AYCF credentials used by the MCP tools
app.admin.user=${ADMIN_USER:}
app.admin.password=${ADMIN_PASSWORD:}

# Logging
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} [32m%-5level [0m - %msg [36m[%class.%method:%line][0m%n
logging.file.name=messages.log
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss} %-5level - %msg [%class.%method:%line]%n

# Prometheus/Actuator
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.graphite.metrics.export.enabled=true

# MCP Server (OpenClaw connects to http://localhost:8080/sse)
spring.ai.mcp.server.name=flight-finder
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.description=Wizz Air AYCF flight search automation
spring.ai.mcp.server.type=SYNC
